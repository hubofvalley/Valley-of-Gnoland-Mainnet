name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-validation:
    name: Shell and contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show ShellCheck version
        run: shellcheck --version

      - name: Check Bash syntax
        run: bash -n resources/*.sh tests/*.sh

      - name: Run ShellCheck
        run: shellcheck --severity=warning resources/*.sh tests/*.sh

      - name: Validate JSON
        run: git ls-files -z '*.json' | xargs -0 -r -n1 jq empty

      - name: Run mainnet contract test
        run: bash tests/mainnet_contract_test.sh

      - name: Run multi-instance guard regression test
        run: bash tests/multi_instance_test.sh

      - name: Run mainnet Node Doctor regression test
        run: bash tests/node_doctor_test.sh

      - name: Run release identity regression test
        run: bash tests/release_identity_test.sh

      - name: Run snapshot fail-closed regression test
        run: bash tests/apply_snapshot_test.sh

      - name: Run local-helper regression test
        run: bash tests/runtime_script_pin_test.sh

      - name: Run validator interaction regression test
        run: bash tests/validator_interactions_test.sh

      - name: Check patch whitespace
        run: git diff --check

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          version='1.7.12'
          archive="actionlint_${version}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          curl -fsSLo "/tmp/${archive}" "$url"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          /tmp/actionlint -version

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint -color

      - name: Audit GitHub Actions security with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          inputs: ./.github/
          version: 1.29.0
